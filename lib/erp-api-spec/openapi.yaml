          type: string
        totalAmount:
          type: number
        paidAmount:
          type: number
        outstandingAmount:
          type: number
        taxType:
          type: string
          enum: [taxable, zero_rated, exempt, unclassified]
        taxRate:
          type: number
        netAmount:
          type: number
          description: 未稅金額（TWD 本位）
        taxAmount:
          type: number
          description: 稅額（TWD 本位）
        govInvoiceNumber:
          type: ["string", "null"]
        ecpayInvoiceNumber:
          type: ["string", "null"]
        ecpayRandomNumber:
          type: ["string", "null"]
        ecpayInvoiceDate:
          type: ["string", "null"]
