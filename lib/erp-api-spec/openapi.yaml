        paidAmount:
          type: number
        dueDate:
          type: string
        taxType:
          type: string
          enum: [taxable, zero_rated, exempt, unclassified]
        taxRate:
          type: number
          minimum: 0
          maximum: 100
        taxIncluded:
          type: boolean
          description: 目前總額是否為含稅金額
        govInvoiceNumber:
          type: ["string", "null"]

