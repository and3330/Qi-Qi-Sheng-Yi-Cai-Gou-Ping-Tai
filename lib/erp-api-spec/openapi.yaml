openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ERP System API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard & analytics
  - name: employees
    description: Employee management
  - name: departments
    description: Department management
  - name: attendance
    description: Attendance tracking
  - name: leave
    description: Leave management
  - name: customers
    description: Customer management
  - name: suppliers
    description: Supplier management
  - name: items
    description: Item/product management
  - name: warehouses
    description: Warehouse management
  - name: stock
    description: Stock entry management
  - name: sales-orders
    description: Sales order management
  - name: purchase-orders
    description: Purchase order management
  - name: leads
    description: CRM leads
  - name: opportunities
    description: CRM opportunities
  - name: projects
    description: Project management
  - name: tasks
    description: Task management
  - name: accounts
    description: Chart of accounts
  - name: journal-entries
    description: Journal entries
  - name: invoices
    description: Invoice management

paths:
  /admin/login:
    post:
      operationId: loginAdmin
      tags: [admin]
      summary: Sign in to an explicitly identified company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyCode, username, password]
              properties:
                companyCode:
                  type: string
                  pattern: '^[0-9]{8}$'
                username:
                  type: string
                  description: Trimmed and case-sensitive within the company.
                password:
                  type: string
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                type: object
                required: [id, tenantId, companyCode, username, displayName, role]
                properties:
                  id:
                    type: integer
                  tenantId:
                    type: integer
                  companyCode:
                    type: string
                  username:
                    type: string
                  displayName:
                    type: string
                  role:
                    type: string
                  employeeId:
                    type: [integer, "null"]
        '401':
          description: Generic invalid credentials, including missing or invalid company code
        '503':
          description: Authentication unavailable
  /public/signup:
    post:
      operationId: signupCompany
      tags: [admin]
      summary: Atomically provision a company and its owner account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyCode, companyName, contactEmail, username, password]
              properties:
                companyCode:
                  type: string
                  pattern: '^[0-9]{8}$'
                companyName:
                  type: string
                contactEmail:
                  type: string
                username:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
      responses:
        '201':
          description: Company provisioned and session created
          content:
            application/json:
              schema:
                type: object
                required: [ok, tenant]
                properties:
                  ok:
                    type: boolean
                  tenant:
                    type: object
                    required: [id, name, companyCode, status, aiCredits]
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      companyCode:
                        type: string
                      status:
                        type: string
                      aiCredits:
                        type: integer
                      trialEndsAt:
                        type: [string, "null"]
        '400':
          description: Invalid registration
        '409':
          description: Company code already registered
  /platform/tenants:
    get:
      operationId: listPlatformTenants
      tags: [admin]
      summary: List companies (existing platform super-admin authorization required)
      responses:
        '200':
          description: Companies, including explicit codes or null for unmapped legacy companies
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, companyCode]
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    companyCode:
                      type: [string, "null"]
  /platform/tenants/{id}:
    patch:
      operationId: updatePlatformTenant
      tags: [admin]
      summary: Update a company, including authoritative company-code enrollment
      description: Requires existing platform super-admin authorization. Company-code changes invalidate affected company sessions. Never infers or defaults legacy company codes.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyCode:
                  type: string
                  pattern: '^[0-9]{8}$'
                trialEndsAt:
                  type: [string, "null"]
                isExempt:
                  type: boolean
      responses:
        '200':
          description: Updated company settings
          content:
            application/json:
              schema:
                type: object
                required: [ok, companyCode, trialEndsAt, isExempt, status]
                properties:
                  ok:
                    type: boolean
                  companyCode:
                    type: [string, "null"]
                  trialEndsAt:
                    type: [string, "null"]
                  isExempt:
                    type: boolean
                  status:
                    type: string
        '400':
          description: Invalid company code or settings
        '409':
          description: Company code already in use
  /admin/recovery-email:
    get:
      operationId: getRecoveryEmail
      tags: [admin]
      summary: Get own recovery email (session required; API keys rejected)
      responses:
        '200':
          description: Recovery email status
          content:
            application/json:
              schema:
                type: object
                required: [email, verified]
                properties:
                  email:
                    type: [string, "null"]
                  verified:
                    type: boolean
        '401':
          description: Session required
        '503':
          description: Recovery infrastructure unavailable
    post:
      operationId: enrollRecoveryEmail
      tags: [admin]
      summary: Send verification to own recovery email (session and current password required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, currentPassword]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                currentPassword:
                  type: string
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryMessage'
        '400':
          description: Invalid email or current password
        '401':
          description: Session required
        '429':
          description: Rate limited
        '503':
          description: Recovery infrastructure or mail unavailable
  /admin/verify-recovery-email:
    post:
      operationId: verifyRecoveryEmail
      tags: [admin]
      summary: Consume a one-use recovery email verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryMessage'
        '400':
          description: Invalid, expired or already used token
        '429':
          description: Rate limited
        '503':
          description: Recovery infrastructure unavailable
  /admin/forgot-password:
    post:
      operationId: forgotPassword
      tags: [admin]
      summary: Request reset using only the account's verified recovery email
      description: Identical response for missing, inactive, unenrolled accounts and mail delivery failure. Account-based throttling also returns the generic success message. Responses are padded to six seconds regardless of identity; database work is bounded to one second, mail delivery to three seconds, and failed-delivery cleanup to one second. IP throttling is independent of account identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyCode, username]
              properties:
                companyCode:
                  type: string
                  pattern: '^[0-9]{8}$'
                username:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Generic acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryMessage'
        '429':
          description: IP rate limited
        '503':
          description: Recovery infrastructure unavailable
  /admin/reset-password:
    post:
      operationId: resetPassword
      tags: [admin]
      summary: Reset password and revoke all account sessions without signing in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  description: At least 10 Unicode code points and at most 72 UTF-8 bytes, including at least one ASCII letter A–Z or a–z and one digit 0–9. Never trim the password.
      responses:
        '200':
          description: Password reset; sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryMessage'
        '400':
          description: Invalid password policy or invalid, expired or replayed token
        '429':
          description: Rate limited
        '503':
          description: Recovery infrastructure unavailable
