    EcpayInvoiceAllowanceItem:
      type: object
      required: [name, count, unitPrice, amount]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        count:
          type: integer
          minimum: 1
        unitPrice:
          type: integer
          minimum: 0
        amount:
          type: integer
          minimum: 1
        word:
          type: string
          maxLength: 6

    EcpayInvoiceIssueInput:
      type: object
      description: |
        開票畫面由訂單關聯客戶自動帶入買方資料。新開票請求必須提供姓名（公司發票為公司抬頭）、
        完整地址、電話及有效 Email；公司發票另須 8 碼統編。資料不完整時回傳 400，
        不建立開票請求或呼叫綠界。已保存的開票請求重試沿用原始內容，不受後來客戶資料修改影響。
      required: [idempotencyKey, invoiceType, items]
      properties:
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
        invoiceType:
          type: string
          enum: [personal, company, donation]
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
        customerPhone:
          type: string
        customerAddr:
          type: string
        taxId:
          type: string
          pattern: '^\d{8}$'
        companyTitle:
          type: string
        carrierType:
          type: string
          enum: [phone_barcode, citizen_certificate, ecpay_carrier]
        carrierNum:
          type: string
        loveCode:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EcpayInvoiceAllowanceItem"

    EcpayInvoiceAllowanceInput:
      type: object
      required: [amount, reason, items]
      properties:
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
        amount:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 200
        notify:
          type: string
          enum: [E, S, A, N]
          default: N
        notifyEmail:
          type: string
          format: email
        notifyPhone:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EcpayInvoiceAllowanceItem"

    EcpayInvoiceAllowance:
      type: object
      required: [id, invoiceId, allowanceDate, amount, items, reason, notifyType, status, accountingEffect]
      properties:
        id:
          type: integer
        invoiceId:
          type: integer
        allowanceNumber:
          type: ["string", "null"]
        allowanceDate:
          type: string
        amount:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/EcpayInvoiceAllowanceItem"
        reason:
          type: string
        notifyType:
          type: string
          enum: [E, S, A, N]
        status:
          type: string
          enum: [Pending, Issued, Failed, VoidPending, IssueReconcileRequired, VoidReconcileRequired, Voided]
        voidReason:
          type: ["string", "null"]
        voidedAt:
          type: ["string", "null"]
          format: date-time
        accountingEffect:
          type: string
          enum: [none]

    EcpayVoidInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200

    EcpayAllowanceReconciliationInput:
      type: object
      required: [allowanceNumber]
      properties:
        allowanceNumber:
          type: string
          pattern: '^\d{16}$'

    EcpayInvoiceAllowanceResult:
      type: object
      required: [success, allowance]
      properties:
        success:
          type: boolean
        idempotent:
          type: boolean
        allowance:
          $ref: "#/components/schemas/EcpayInvoiceAllowance"

    EcpayInvoiceActionResult:
      type: object
      required: [success, invoice]
      properties:
        success:
          type: boolean
        idempotent:
          type: boolean
        invoice:
          $ref: "#/components/schemas/Invoice"
        remote:
          type: object
          additionalProperties: true

    CreateInvoiceBody:
      type: object
      properties:
        invoiceType:
          type: string
        customerId:
          type: integer
        supplierId:
          type: integer
        invoiceDate:
          type: string
        dueDate:
          type: string
        taxType:
          type: string
          enum: [taxable, zero_rated, exempt, unclassified]
          default: unclassified
        taxRate:
          type: number
          minimum: 0
          maximum: 100
          default: 5
        taxIncluded:
          type: boolean
          default: true
          description: 明細合計是否為含稅金額
        govInvoiceNumber:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: integer
              quantity:
                type: number
              rate:
                type: number
            required:
              - itemId
              - quantity
              - rate
      required:
