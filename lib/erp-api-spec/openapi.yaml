      type: object
      additionalProperties: false
      required: [accountNumber, accountName, accountType, parentCode, isGroup, cashFlowCategory]
      properties:
        accountNumber:
          type: string
          minLength: 1
          maxLength: 64
        accountName:
          type: string
          minLength: 1
          maxLength: 200
        accountType:
          type: string
          enum: [Asset, Liability, Equity, Income, Expense]
        parentCode:
          type: string
          nullable: true
        isGroup:
          type: boolean
        cashFlowCategory:
          type: string
          nullable: true
          enum: [operating, investing, financing, cash]
    AccountConfiguration:
      type: object
      additionalProperties: false
      required: [version, companyCode, accounts]
      properties:
        version:
          type: integer
          enum: [1]
        companyCode:
          type: string
          pattern: "^\\d{8}$"
        accounts:
          type: array
          minItems: 0
          maxItems: 5000
          items:
            $ref: "#/components/schemas/AccountConfigurationRow"
