  /accounts/configuration/import:
    post:
      operationId: importAccountConfiguration
      tags: [accounts]
      summary: Insert missing accounts atomically, preserving existing accounting data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [configuration, fingerprint, confirmation]
              properties:
                configuration:
                  $ref: "#/components/schemas/AccountConfiguration"
                fingerprint:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
                confirmation:
                  type: string
                  enum: [新增缺少科目]
      responses:
        "200":
          description: Accounts inserted or skipped
          content:
            application/json:
              schema:
                type: object
                required: [inserted, existing]
                properties:
                  inserted:
                    type: integer
                  existing:
                    type: integer
