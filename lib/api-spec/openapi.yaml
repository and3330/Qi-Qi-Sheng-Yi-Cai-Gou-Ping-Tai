openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: 七期生醫採購平台 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: admin-mcp
  - name: me
  - name: products
  - name: cart
  - name: orders
  - name: institutions
  - name: knowledge
  - name: announcements
  - name: favorites
  - name: home
  - name: admin
  - name: portal
  - name: erp
  - name: erp-accounting
  - name: erp-reports
  - name: social
  - name: newsletter
  - name: erp-hr
paths:
  /portal/summary:
    get:
      operationId: getPortalSummary
      tags:
        - portal
      summary: 機構後台總覽（限醫院/診所會員）
      responses:
        '200':
          description: Portal summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSummary'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /portal/orders:
    get:
      operationId: listPortalOrders
      tags:
        - portal
      summary: 機構訂單總覽（已綁定院所者含同院所所有訂單）
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - paid
              - shipped
              - completed
              - cancelled
              - returned
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortalOrder'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /portal/reports:
    get:
      operationId: getPortalReports
      tags:
        - portal
      summary: 機構採購統計（近 6 個月金額與常購品項）
      responses:
        '200':
          description: Purchase reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalReports'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/stats:
    get:
      operationId: getAdminStats
      tags:
        - admin
      summary: 後台儀表板統計數字（限管理員）
      responses:
        '200':
          description: Admin dashboard stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/members:
    post:
      operationId: createAdminMember
      tags:
        - admin
      summary: 後台建立會員（限系統管理員）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMemberCreate'
      responses:
        '201':
          description: Created member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMember'
        '400':
          description: Invalid input or duplicate username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    get:
      operationId: listAdminMembers
      tags:
        - admin
      summary: 會員列表（限管理員）
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: 搜尋帳號 / 姓名 / Email / 電話
        - name: tier
          in: query
          required: false
          schema:
            type: string
            enum:
              - hospital
              - clinic
              - consumer
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminMember'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/members/{id}:
    get:
      operationId: getAdminMember
      tags:
        - admin
      summary: 會員詳情（限管理員）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMember'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    patch:
      operationId: updateAdminMember
      tags:
        - admin
      summary: 編輯會員資料 / 等級 / 角色 / 啟用狀態（限管理員）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMemberUpdate'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMember'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/products:
    get:
      operationId: listAdminProducts
      tags:
        - admin
      summary: 商品列表（限管理員，含下架與成本價）
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - all
              - active
              - inactive
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProduct'
    post:
      operationId: createAdminProduct
      tags:
        - admin
      summary: 新增商品（限管理員）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductInput'
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/products/{id}:
    patch:
      operationId: updateAdminProduct
      tags:
        - admin
      summary: 編輯商品 / 上下架（限管理員）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductUpdate'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/inventory/adjust:
    post:
      operationId: adjustAdminStock
      tags:
        - admin
      summary: 手動調整庫存（盤點 / 報廢等，限管理員）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustInput'
      responses:
        '201':
          description: Created stock movement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStockMovement'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/stock-movements:
    get:
      operationId: listAdminStockMovements
      tags:
        - admin
      summary: 庫存異動紀錄（限管理員）
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
            enum:
              - purchase
              - sale
              - adjust
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Stock movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminStockMovement'
  /admin/suppliers:
    get:
      operationId: listAdminSuppliers
      tags:
        - admin
      summary: 供應商列表（限管理員）
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
    post:
      operationId: createAdminSupplier
      tags:
        - admin
      summary: 新增供應商（限管理員）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInput'
      responses:
        '201':
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/suppliers/{id}:
    patch:
      operationId: updateAdminSupplier
      tags:
        - admin
      summary: 編輯供應商（限管理員）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierUpdate'
      responses:
        '200':
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/purchase-orders:
    get:
      operationId: listAdminPurchaseOrders
      tags:
        - admin
      summary: 採購單列表（限管理員）
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - ordered
              - received
              - cancelled
      responses:
        '200':
          description: Purchase orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPurchaseOrder'
    post:
      operationId: createAdminPurchaseOrder
      tags:
        - admin
      summary: 建立採購單（限管理員）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '201':
          description: Created purchase order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPurchaseOrder'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/purchase-orders/{id}:
    get:
      operationId: getAdminPurchaseOrder
      tags:
        - admin
      summary: 採購單詳情（限管理員）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Purchase order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPurchaseOrder'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/purchase-orders/{id}/status:
    patch:
      operationId: updateAdminPurchaseOrderStatus
      tags:
        - admin
      summary: 採購單狀態流轉（草稿→已下單、取消，限管理員）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderStatusUpdate'
      responses:
        '200':
          description: Updated purchase order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPurchaseOrder'
        '400':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/purchase-orders/{id}/receive:
    post:
      operationId: receiveAdminPurchaseOrder
      tags:
        - admin
      summary: 採購單收貨入庫（增加庫存、更新成本、寫入異動紀錄，限管理員）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Received purchase order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPurchaseOrder'
        '400':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags:
        - admin
      summary: 全部訂單列表（限管理員）
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - paid
              - shipped
              - completed
              - cancelled
              - returned
        - name: search
          in: query
          schema:
            type: string
          description: 搜尋訂單編號 / 會員姓名
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminOrder'
  /admin/orders/{id}:
    get:
      operationId: getAdminOrder
      tags:
        - admin
      summary: 訂單詳情（限管理員）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/orders/{id}/status:
    patch:
      operationId: updateAdminOrderStatus
      tags:
        - admin
      summary: 更新訂單狀態（限管理員）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '400':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/orders/bulk-status:
    post:
      operationId: bulkUpdateAdminOrderStatus
      tags:
        - admin
      summary: 批量更新訂單狀態（限管理員；逐筆套用狀態機，不符合的跳過並回報原因）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOrderStatusUpdate'
      responses:
        '200':
          description: Bulk status result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOrderStatusResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/orders/bulk-delete:
    post:
      operationId: bulkDeleteAdminOrders
      tags:
        - admin
      summary: 批量刪除訂單（限管理員；僅已取消/已退貨可刪，已有銷退紀錄者保留）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOrderIds'
      responses:
        '200':
          description: Bulk delete result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOrderDeleteResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /admin/reports/inventory:
    get:
      operationId: getAdminInventoryReport
      tags:
        - admin
      summary: 期間進銷存彙總報表（限管理員）
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Inventory report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryReport'
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/register:
    post:
      operationId: register
      tags:
        - me
      summary: Register a new member account (starts session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Registered member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Invalid input or username taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /auth/login:
    post:
      operationId: login
      tags:
        - me
      summary: Log in with username and password (starts session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged-in member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          description: Wrong username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /auth/logout:
    post:
      operationId: logout
      tags:
        - me
      summary: Log out (destroys session)
      responses:
        '204':
          description: Logged out
  /me:
    get:
      operationId: getMe
      tags:
        - me
      summary: Get current member profile
      responses:
        '200':
          description: Member profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    patch:
      operationId: updateMe
      tags:
        - me
      summary: Update current member profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
  /products:
    get:
      operationId: listProducts
      tags:
        - products
      summary: List products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - recommended
              - priceAsc
              - priceDesc
              - newest
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /products/{id}:
    get:
      operationId: getProduct
      tags:
        - products
      summary: Get product detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /cart:
    get:
      operationId: getCart
      tags:
        - cart
      summary: Get current member cart
      responses:
        '200':
          description: Cart items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'
    post:
      operationId: addCartItem
      tags:
        - cart
      summary: Add item to cart (upserts quantity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
      responses:
        '200':
          description: Updated cart item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
    delete:
      operationId: clearCart
      tags:
        - cart
      summary: Clear cart
      responses:
        '204':
          description: Cleared
  /cart/{id}:
    patch:
      operationId: updateCartItem
      tags:
        - cart
      summary: Update cart item quantity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpdate'
      responses:
        '200':
          description: Updated cart item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
    delete:
      operationId: removeCartItem
      tags:
        - cart
      summary: Remove cart item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Removed
  /orders:
    get:
      operationId: listOrders
      tags:
        - orders
      summary: List current member orders
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: createOrder
      tags:
        - orders
      summary: Create order from explicit items (checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /orders/{id}:
    get:
      operationId: getOrder
