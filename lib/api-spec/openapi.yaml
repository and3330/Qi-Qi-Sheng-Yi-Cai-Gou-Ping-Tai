        grossProfit: { type: integer }
        expenseTotal: { type: integer }
        profitShareTotal: { type: integer }
        netProfit: { type: integer }
        months:
          type: array
          items:
            $ref: "#/components/schemas/PnlMonthRow"
    CreateConversationInput:
      type: object
      properties:
        title: { type: string }
    AssistantConversation:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string }
    ChatMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: integer }
        role: { type: string }
        content: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string }
    AiIndexRebuildResult:
      type: object
      required: [ok, embedding, counts]
      properties:
        ok: { type: boolean }
        embedding: { type: string, description: "vector（向量檢索）或 keyword（關鍵字退回）" }
        counts:
          type: object
          additionalProperties: { type: integer }
    SupportConversation:
      type: object
      required: [id, title, status, needsHuman, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        needsHuman: { type: boolean }
        createdAt: { type: string }
    AdminSupportConversation:
      type: object
      required: [id, memberName, memberUsername, status, needsHuman, createdAt]
      properties:
        id: { type: integer }
        memberName: { type: string }
        memberUsername: { type: string }
        status: { type: string }
        needsHuman: { type: boolean }
        createdAt: { type: string }
    SupportThread:
      type: object
      required: [conversation, messages]
      properties:
        conversation:
          type: object
          required: [id, status, needsHuman]
          properties:
            id: { type: integer }
            status: { type: string }
            needsHuman: { type: boolean }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
    SupportReply:
      type: object
      required: [needsHuman]
      properties:
        reply:
          oneOf:
            - $ref: "#/components/schemas/ChatMessage"
            - type: "null"
        needsHuman: { type: boolean }
    PointTransaction:
      type: object
      required: [id, type, delta, balanceAfter, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, description: earn/redeem/refund/revoke/adjust }
        delta: { type: integer }
        balanceAfter: { type: integer }
        orderId: { type: ["integer", "null"] }
        note: { type: ["string", "null"] }
        createdAt: { type: string }
    AdminInstitutionUpdate:
      type: object
      properties:
        grade: { type: ["string", "null"], enum: [A, B, C, null] }
    QuotationItemInput:
      type: object
      required: [productId, unitPrice, quantity]
      properties:
        productId: { type: integer }
        variantId: { type: ["integer", "null"] }
        unitPrice: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
    QuotationInput:
      type: object
      required: [customerName, items]
      properties:
        customerName: { type: string, minLength: 1 }
        memberId: { type: ["integer", "null"], description: 綁定會員（轉訂單必填） }
        institutionId: { type: ["integer", "null"] }
        validUntil: { type: ["string", "null"], description: YYYY-MM-DD }
        note: { type: ["string", "null"] }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/QuotationItemInput"
    QuotationItem:
      type: object
      required: [id, productId, productName, productCode, unitPrice, quantity]
      properties:
        id: { type: integer }
        productId: { type: integer }
        variantId: { type: ["integer", "null"] }
        variantName: { type: ["string", "null"] }
        productName: { type: string }
        productCode: { type: string }
        unitPrice: { type: integer }
        quantity: { type: integer }
    Quotation:
      type: object
      required: [id, quoteNo, customerName, status, totalAmount, createdAt, items]
      properties:
        id: { type: integer }
        quoteNo: { type: string }
        customerName: { type: string }
        memberId: { type: ["integer", "null"] }
        memberName: { type: ["string", "null"] }
        institutionId: { type: ["integer", "null"] }
        institutionName: { type: ["string", "null"] }
        status: { type: string, enum: [draft, sent, accepted, converted, cancelled] }
        totalAmount: { type: integer }
        validUntil: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        convertedOrderId: { type: ["integer", "null"] }
        convertedOrderNo: { type: ["string", "null"] }
        createdAt: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuotationItem"
    QuotationStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [sent, accepted, cancelled] }
