components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ErrorMessage:
      type: object
      properties:
        error: { type: string }
      required: [error]
    RegisterInput:
      type: object
      required: [username, password, name]
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: "^[a-zA-Z0-9_.-]+$" }
        password: { type: string, minLength: 8, maxLength: 72 }
        name: { type: string, minLength: 1 }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        tier:
          type: string
          enum: [hospital, clinic, consumer]
          description: 由專屬註冊連結帶入的會員身份（預設 consumer）
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    Member:
      type: object
      required: [id, username, name, tier, points]
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        tier:
          type: string
          enum: [hospital, clinic, consumer]
          description: A 醫院 / B 診所藥局 / C 消費者
        role:
          type: string
          enum: [admin, ops, support, member]
          description: 系統管理員 / 營運 / 客服 / 一般會員
        boundInstitutionId: { type: ["integer", "null"] }
        boundInstitutionName: { type: ["string", "null"] }
        boundDepartment: { type: ["string", "null"] }
        points: { type: integer }
        shippingAddress: { type: ["string", "null"] }
    PortalSummary:
      type: object
      required: [tier, institutionScope, walletBalance, monthOrderCount, monthPurchaseTotal, pendingOrderCount, recentOrders]
      properties:
        institutionName: { type: ["string", "null"], description: "綁定院所名稱，未綁定為 null" }
        institutionScope: { type: boolean, description: "true 表示資料範圍為整個院所，false 為個人" }
        tier:
          type: string
          enum: [hospital, clinic]
        walletBalance: { type: integer, description: "本人錢包餘額 (NT$)" }
        monthOrderCount: { type: integer, description: "本月訂單數" }
        monthPurchaseTotal: { type: integer, description: "本月採購金額（不含已取消，NT$）" }
        pendingOrderCount: { type: integer, description: "待處理訂單數" }
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/PortalOrder"
    PortalOrder:
      type: object
      required: [id, orderNo, status, paymentMethod, totalAmount, memberName, createdAt]
      properties:
        id: { type: integer }
        orderNo: { type: string }
        status:
          type: string
          enum: [pending, paid, shipped, completed, cancelled]
        paymentMethod:
          type: string
          enum: [bank_transfer, cod, wallet]
        totalAmount: { type: integer }
        memberName: { type: string, description: "下單人姓名" }
        boundDepartment: { type: ["string", "null"], description: "下單人科室" }
        createdAt: { type: string, format: date-time }
    PortalMonthlyStat:
      type: object
      required: [month, orderCount, purchaseTotal]
      properties:
        month: { type: string, description: "YYYY-MM" }
        orderCount: { type: integer }
        purchaseTotal: { type: integer, description: "不含已取消 (NT$)" }
    PortalTopProduct:
      type: object
      required: [productName, productCode, quantity, amount]
      properties:
        productName: { type: string }
        productCode: { type: string }
        quantity: { type: integer }
        amount: { type: integer }
    PortalReports:
      type: object
      required: [months, topProducts, institutionScope]
      properties:
        institutionScope: { type: boolean }
        months:
          type: array
          items:
            $ref: "#/components/schemas/PortalMonthlyStat"
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/PortalTopProduct"
    AdminStats:
      type: object
      required: [orderCount, pendingOrderCount, totalRevenue, memberCount, lowStockCount]
      properties:
        orderCount: { type: integer, description: "訂單總數" }
        pendingOrderCount: { type: integer, description: "待處理訂單數" }
        totalRevenue: { type: integer, description: "營收（不含已取消，NT$）" }
        memberCount: { type: integer, description: "會員總數" }
        lowStockCount: { type: integer, description: "低庫存品項數（庫存 <= 10）" }
    AdminMember:
      type: object
      required: [id, username, name, tier, role, isActive, points, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        tier:
          type: string
          enum: [hospital, clinic, consumer]
        role:
          type: string
          enum: [admin, ops, support, member]
          description: 系統管理員 / 營運 / 客服 / 一般會員
        isActive: { type: boolean }
        points: { type: integer }
        boundInstitutionId: { type: ["integer", "null"] }
        institutionVerified: { type: boolean, description: "綁定院所是否已審核（通過才能查看整個院所資料）" }
        boundDepartment: { type: ["string", "null"] }
        shippingAddress: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AdminMemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        tier:
          type: string
          enum: [hospital, clinic, consumer]
        role:
          type: string
          enum: [admin, ops, support, member]
          description: 系統管理員 / 營運 / 客服 / 一般會員
        isActive: { type: boolean }
        institutionVerified: { type: boolean }
        shippingAddress: { type: ["string", "null"] }
    MemberUpdate:
      type: object
      description: 會員身份 (tier) 由平台審核後台調整，不開放自行修改
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: ["string", "null"] }
        boundInstitutionId: { type: ["integer", "null"] }
        boundDepartment: { type: ["string", "null"] }
        shippingAddress: { type: ["string", "null"] }
    Product:
      type: object
      required: [id, code, name, category, priceHospital, priceClinic, priceConsumer, stock, isHot, isNew]
      properties:
        id: { type: integer }
        code: { type: string, description: "商品編號，如 10011" }
        name: { type: string }
        category:
          type: string
          description: "保健食品 / 醫療耗材 / 保養清潔 / 院所專區"
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        priceHospital: { type: integer, description: "A 醫院價 (NT$)" }
        priceClinic: { type: integer, description: "B 診所/藥局價 (NT$)" }
        priceConsumer: { type: integer, description: "C 消費者/會員價 (NT$)" }
        stock: { type: integer }
        isHot: { type: boolean }
        isNew: { type: boolean }
        variants:
          type: array
          description: 多規格（僅商品詳情提供；空陣列或缺省表示單一規格）
          items:
            $ref: "#/components/schemas/ProductVariant"
        spec: { type: ["string", "null"], description: "規格，如 90粒/瓶" }
    ProductVariant:
      type: object
      required: [id, productId, name, priceHospital, priceClinic, priceConsumer, stock, isActive]
      properties:
        id: { type: integer }
        productId: { type: integer }
        name: { type: string, description: "規格名稱，如 500ml、大盒裝" }
        priceHospital: { type: integer }
        priceClinic: { type: integer }
        priceConsumer: { type: integer }
        stock: { type: integer }
        isActive: { type: boolean }
    AdminProductVariant:
      type: object
      required: [id, productId, name, priceHospital, priceClinic, priceConsumer, costPrice, stock, isActive, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        name: { type: string }
        priceHospital: { type: integer }
        priceClinic: { type: integer }
        priceConsumer: { type: integer }
        costPrice: { type: integer }
        stock: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminProductVariantInput:
      type: object
      required: [name, priceHospital, priceClinic, priceConsumer]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        priceHospital: { type: integer, minimum: 0 }
        priceClinic: { type: integer, minimum: 0 }
        priceConsumer: { type: integer, minimum: 0 }
        costPrice: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0, description: "期初庫存，僅建立時使用" }
        isActive: { type: boolean }
    AdminProductVariantUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        priceHospital: { type: integer, minimum: 0 }
        priceClinic: { type: integer, minimum: 0 }
        priceConsumer: { type: integer, minimum: 0 }
        costPrice: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    CartItem:
      type: object
      required: [id, productId, quantity, product]
      properties:
        id: { type: integer }
        productId: { type: integer }
        variantId: { type: ["integer", "null"] }
        quantity: { type: integer }
        product:
          $ref: "#/components/schemas/Product"
        variant:
          oneOf:
            - $ref: "#/components/schemas/ProductVariant"
            - type: "null"
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer }
        variantId: { type: ["integer", "null"] }
        quantity: { type: integer, minimum: 1 }
    CartItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
    OrderItem:
      type: object
      required: [id, productId, productName, productCode, unitPrice, quantity]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        productCode: { type: string }
        unitPrice: { type: integer }
        variantId: { type: ["integer", "null"] }
        variantName: { type: ["string", "null"] }
        quantity: { type: integer }
    Order:
      type: object
      required: [id, orderNo, status, paymentMethod, totalAmount, createdAt, items]
      properties:
        id: { type: integer }
        orderNo: { type: string }
        status:
          type: string
          enum: [pending, paid, shipped, completed, cancelled]
        paymentMethod:
          type: string
          enum: [bank_transfer, cod, wallet]
          description: 匯款 / 貨到付款 / 錢包扣款(預留)
        totalAmount: { type: integer }
        pointsUsed: { type: integer }
        pointsEarned: { type: integer }
        shippingAddress: { type: ["string", "null"] }
        receiverName: { type: ["string", "null"] }
        receiverPhone: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        shipmentPhotos:
          type: array
          items: { type: string }
          description: 出貨照片物件路徑
        createdAt: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    OrderLineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer }
        variantId: { type: ["integer", "null"] }
        quantity: { type: integer, minimum: 1 }
    OrderInput:
      type: object
      required: [paymentMethod, items, receiverName, receiverPhone, shippingAddress]
      properties:
        paymentMethod:
          type: string
          enum: [bank_transfer, cod, wallet]
        receiverName: { type: string, minLength: 1 }
        receiverPhone: { type: string, minLength: 1 }
        shippingAddress: { type: string, minLength: 1 }
        note: { type: string }
        clearCart: { type: boolean, description: "下單後是否清空購物車" }
        pointsToUse: { type: integer, minimum: 0, description: "點數折抵（1 點 = NT$1）" }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLineInput"
    Institution:
      type: object
      required: [id, name, type, city]
      properties:
        id: { type: integer }
        name: { type: string }
        type:
          type: string
          enum: [hospital, clinic, pharmacy]
        city: { type: string }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        hours: { type: ["string", "null"] }
        departments:
          type: array
          items: { type: string }
        grade: { type: ["string", "null"], enum: [A, B, C, null], description: 機構分級 }
    Article:
      type: object
      required: [id, kind, title, category, publishedAt]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [article, faq]
        title: { type: string }
        category: { type: string }
        summary: { type: ["string", "null"] }
        content: { type: ["string", "null"], description: "Markdown 內文" }
        imageUrl: { type: ["string", "null"] }
        publishedAt: { type: string }
    Announcement:
      type: object
      required: [id, title, category, publishedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: ["string", "null"] }
        category: { type: string }
        imageUrl: { type: ["string", "null"] }
        publishedAt: { type: string }
    AdminArticle:
      type: object
      required: [id, kind, title, category, status, publishedAt, updatedAt]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [article, faq]
        title: { type: string }
        category: { type: string }
        summary: { type: ["string", "null"] }
        content: { type: ["string", "null"], description: "Markdown 內文" }
        imageUrl: { type: ["string", "null"] }
        status:
          type: string
          enum: [draft, review, published, archived]
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminArticleInput:
      type: object
      required: [kind, title, category]
      properties:
        kind:
          type: string
          enum: [article, faq]
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 50 }
        summary: { type: ["string", "null"], maxLength: 500 }
        content: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"], maxLength: 500 }
        status:
          type: string
          enum: [draft, review, published, archived]
    AdminArticleUpdate:
      type: object
      properties:
        kind:
          type: string
          enum: [article, faq]
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 50 }
        summary: { type: ["string", "null"], maxLength: 500 }
        content: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"], maxLength: 500 }
        status:
          type: string
          enum: [draft, review, published, archived]
    AdminAnnouncement:
      type: object
      required: [id, title, category, status, publishedAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        content: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        status:
          type: string
          enum: [draft, review, published, archived]
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminAnnouncementInput:
      type: object
      required: [title, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 50 }
        content: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"], maxLength: 500 }
        status:
          type: string
          enum: [draft, review, published, archived]
    AdminAnnouncementUpdate:
      type: object
      properties:
