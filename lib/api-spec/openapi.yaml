components:
  securitySchemes:
    NewsletterApiKeyAuth:
      type: http
      scheme: bearer
      description: 電子報公開 v1 API 金鑰。亦接受以 x-api-key 標頭傳遞（本規格文件僅描述 Bearer 形式，兩者伺服器端皆會驗證）。
  schemas:
    CmoGoal:
      type: object
      required:
        - id
        - metric
        - label
        - targetValue
        - currentValue
        - unit
        - period
        - priority
        - status
        - startDate
        - endDate
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        metric:
          type: string
          description: daily_revenue | paid_revenue | orders_count | new_members | published_posts | points_issued | new_articles
        label:
          type: string
        targetValue:
          type: string
        currentValue:
          type: string
        unit:
          type: string
        period:
          type: string
          description: daily | weekly | monthly | quarterly
        priority:
          type: string
          description: high | medium | low
        status:
          type: string
          description: active | on_track | at_risk | behind | achieved
        startDate:
          type: string
        endDate:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
    CreateCmoGoalInput:
      type: object
      required:
        - metric
        - label
        - targetValue
        - startDate
        - endDate
      properties:
        metric:
          type: string
        label:
          type: string
          minLength: 1
        targetValue:
          type: number
        unit:
          type: string
        period:
          type: string
        priority:
          type: string
        startDate:
          type: string
        endDate:
          type: string
    UpdateCmoGoalInput:
      type: object
      properties:
        metric:
          type: string
        label:
          type: string
          minLength: 1
        targetValue:
          type: number
        unit:
          type: string
        period:
          type: string
        priority:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        isActive:
          type: boolean
    CmoSnapshot:
      type: object
      required:
        - date
        - data
      properties:
        date:
          type: string
        data:
          type: object
          additionalProperties: true
    CmoReport:
      type: object
      required:
        - id
        - reportDate
        - reportType
        - summary
        - createdAt
      properties:
        id:
          type: string
        reportDate:
          type: string
        reportType:
          type: string
          description: daily | manual
        summary:
          type: string
        recommendations:
          type:
            - string
            - 'null'
        goalProgress:
          type:
            - array
            - 'null'
          items:
            type: object
            additionalProperties: true
        kpiSnapshot:
          type:
            - object
            - 'null'
          additionalProperties: true
        rawData:
          type:
            - object
            - 'null'
          additionalProperties: true
        createdAt:
          type: string
    SocialAccount:
      type: object
      required:
        - id
        - platform
        - platformAccountId
        - accountName
        - accountType
        - isActive
        - createdAt
      properties:
        id:
          type: string
        platform:
          type: string
          description: facebook | instagram | threads | twitter
        platformAccountId:
          type: string
        accountName:
          type: string
        accountType:
          type: string
        tokenExpiresAt:
          type:
            - string
            - 'null'
        profileImageUrl:
          type:
            - string
            - 'null'
        isActive:
          type: boolean
        createdAt:
          type: string
    SocialCredentialStatus:
      type: object
      required:
        - facebook
        - threads
        - twitter
      properties:
        facebook:
          type: boolean
        threads:
          type: boolean
        twitter:
          type: boolean
    SocialAccountsResponse:
      type: object
      required:
        - accounts
        - credentials
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/SocialAccount'
        credentials:
          $ref: '#/components/schemas/SocialCredentialStatus'
    SocialOAuthUrl:
      type: object
      required:
        - url
      properties:
        url:
          type: string
    SocialPost:
      type: object
      required:
        - id
        - content
        - platforms
        - imageUrls
        - targetAccountIds
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        content:
          type: string
        platforms:
          type: array
          items:
            type: string
        hashtags:
          type:
            - string
            - 'null'
        imageUrls:
          type: array
          items:
            type: string
        scheduledAt:
          type:
            - string
            - 'null'
        publishedAt:
          type:
            - string
            - 'null'
        status:
          type: string
          description: draft | scheduled | publishing | published | failed
        platformResults:
          type:
            - object
            - 'null'
          additionalProperties: true
        targetAccountIds:
          type: object
          additionalProperties:
            type: string
          description: 各平台指定的社群帳號 UUID
        errorMessage:
          type:
            - string
            - 'null'
        createdAt:
          type: string
        updatedAt:
          type: string
    CreateSocialPostInput:
      type: object
      required:
        - content
        - platforms
      properties:
        content:
          type: string
          minLength: 1
        platforms:
          type: array
          items:
            type: string
          minItems: 1
        hashtags:
          type:
            - string
            - 'null'
        imageUrls:
          type: array
          items:
            type: string
        targetAccountIds:
          type: object
          additionalProperties:
            type: string
        scheduledAt:
          type:
            - string
            - 'null'
          description: ISO 時間，null 表示草稿
    UpdateSocialPostInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        platforms:
          type: array
          items:
            type: string
          minItems: 1
        hashtags:
          type:
            - string
            - 'null'
        imageUrls:
          type: array
          items:
            type: string
        targetAccountIds:
          type: object
          additionalProperties:
            type: string
        scheduledAt:
          type:
            - string
            - 'null'
    SocialPublishResult:
      type: object
      required:
        - post
        - results
        - errors
      properties:
        post:
          $ref: '#/components/schemas/SocialPost'
        results:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            type: string
    SocialPreviewInput:
      type: object
      required:
        - content
        - platforms
      properties:
        content:
          type: string
        hashtags:
          type:
            - string
            - 'null'
        platforms:
          type: array
          items:
            type: string
    SocialPreviewResponse:
      type: object
      required:
        - previews
      properties:
        previews:
          type: array
          items:
            type: object
            required:
              - platform
              - charLimit
              - text
            properties:
              platform:
                type: string
              charLimit:
                type: integer
              text:
                type: string
    SocialGenerateContentInput:
      type: object
      required:
        - topic
        - platforms
      properties:
