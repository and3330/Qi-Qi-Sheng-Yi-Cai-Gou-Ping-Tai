components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ErrorMessage:
      type: object
      properties:
        error: { type: string }
      required: [error]
    RegisterInput:
      type: object
      required: [username, password, name]
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: "^[a-zA-Z0-9_.-]+$" }
        password: { type: string, minLength: 8, maxLength: 72 }
        name: { type: string, minLength: 1 }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        tier:
          type: string
          enum: [hospital, clinic, consumer]
          description: 由專屬註冊連結帶入的會員身份（預設 consumer）
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    Member:
      type: object
      required: [id, username, name, tier, points]
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        tier:
          type: string
          enum: [hospital, clinic, consumer]
          description: A 醫院 / B 診所藥局 / C 消費者
        role:
          type: string
          enum: [admin, member]
        boundInstitutionId: { type: ["integer", "null"] }
        boundInstitutionName: { type: ["string", "null"] }
        boundDepartment: { type: ["string", "null"] }
        points: { type: integer }
        shippingAddress: { type: ["string", "null"] }
    AdminStats:
      type: object
      required: [orderCount, pendingOrderCount, totalRevenue, memberCount, lowStockCount]
      properties:
        orderCount: { type: integer, description: "訂單總數" }
        pendingOrderCount: { type: integer, description: "待處理訂單數" }
        totalRevenue: { type: integer, description: "營收（不含已取消，NT$）" }
        memberCount: { type: integer, description: "會員總數" }
        lowStockCount: { type: integer, description: "低庫存品項數（庫存 <= 10）" }
    AdminMember:
      type: object
      required: [id, username, name, tier, role, isActive, points, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        tier:
          type: string
          enum: [hospital, clinic, consumer]
        role:
          type: string
          enum: [admin, member]
        isActive: { type: boolean }
        points: { type: integer }
        boundInstitutionId: { type: ["integer", "null"] }
        boundDepartment: { type: ["string", "null"] }
        shippingAddress: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AdminMemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        tier:
          type: string
          enum: [hospital, clinic, consumer]
        role:
          type: string
          enum: [admin, member]
        isActive: { type: boolean }
        shippingAddress: { type: ["string", "null"] }
    MemberUpdate:
      type: object
      description: 會員身份 (tier) 由平台審核後台調整，不開放自行修改
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: ["string", "null"] }
        boundInstitutionId: { type: ["integer", "null"] }
        boundDepartment: { type: ["string", "null"] }
        shippingAddress: { type: ["string", "null"] }
    Product:
      type: object
      required: [id, code, name, category, priceHospital, priceClinic, priceConsumer, stock, isHot, isNew]
      properties:
        id: { type: integer }
        code: { type: string, description: "商品編號，如 10011" }
        name: { type: string }
        category:
          type: string
          description: "保健食品 / 醫療耗材 / 保養清潔 / 院所專區"
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        priceHospital: { type: integer, description: "A 醫院價 (NT$)" }
        priceClinic: { type: integer, description: "B 診所/藥局價 (NT$)" }
        priceConsumer: { type: integer, description: "C 消費者/會員價 (NT$)" }
        stock: { type: integer }
        isHot: { type: boolean }
        isNew: { type: boolean }
        spec: { type: ["string", "null"], description: "規格，如 90粒/瓶" }
    CartItem:
      type: object
      required: [id, productId, quantity, product]
      properties:
        id: { type: integer }
        productId: { type: integer }
        quantity: { type: integer }
        product:
          $ref: "#/components/schemas/Product"
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
    CartItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
    OrderItem:
      type: object
      required: [id, productId, productName, productCode, unitPrice, quantity]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        productCode: { type: string }
        unitPrice: { type: integer }
        quantity: { type: integer }
    Order:
      type: object
      required: [id, orderNo, status, paymentMethod, totalAmount, createdAt, items]
      properties:
        id: { type: integer }
        orderNo: { type: string }
        status:
          type: string
          enum: [pending, paid, shipped, completed, cancelled]
        paymentMethod:
          type: string
          enum: [bank_transfer, cod, wallet]
          description: 匯款 / 貨到付款 / 錢包扣款(預留)
        totalAmount: { type: integer }
        shippingAddress: { type: ["string", "null"] }
        receiverName: { type: ["string", "null"] }
        receiverPhone: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        createdAt: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    OrderLineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
    OrderInput:
      type: object
      required: [paymentMethod, items, receiverName, receiverPhone, shippingAddress]
      properties:
        paymentMethod:
          type: string
          enum: [bank_transfer, cod, wallet]
        receiverName: { type: string, minLength: 1 }
        receiverPhone: { type: string, minLength: 1 }
        shippingAddress: { type: string, minLength: 1 }
        note: { type: string }
        clearCart: { type: boolean, description: "下單後是否清空購物車" }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLineInput"
    Institution:
      type: object
      required: [id, name, type, city]
      properties:
        id: { type: integer }
        name: { type: string }
        type:
          type: string
          enum: [hospital, clinic, pharmacy]
        city: { type: string }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        hours: { type: ["string", "null"] }
        departments:
          type: array
          items: { type: string }
    Article:
      type: object
      required: [id, kind, title, category, publishedAt]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [article, faq]
        title: { type: string }
        category: { type: string }
        summary: { type: ["string", "null"] }
        content: { type: ["string", "null"], description: "Markdown 內文" }
        imageUrl: { type: ["string", "null"] }
        publishedAt: { type: string }
    Announcement:
      type: object
      required: [id, title, category, publishedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: ["string", "null"] }
        category: { type: string }
        imageUrl: { type: ["string", "null"] }
        publishedAt: { type: string }
    FavoriteInput:
      type: object
      required: [productId]
      properties:
        productId: { type: integer }
    AdminProduct:
      type: object
      required: [id, code, name, category, priceHospital, priceClinic, priceConsumer, costPrice, stock, isHot, isNew, isActive, createdAt]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        priceHospital: { type: integer }
        priceClinic: { type: integer }
        priceConsumer: { type: integer }
        costPrice: { type: integer, description: "成本價 (NT$)，隨進貨更新" }
        stock: { type: integer }
        isHot: { type: boolean }
        isNew: { type: boolean }
        isActive: { type: boolean, description: "上架中" }
        spec: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AdminProductInput:
      type: object
      required: [code, name, category, priceHospital, priceClinic, priceConsumer]
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        priceHospital: { type: integer, minimum: 0 }
        priceClinic: { type: integer, minimum: 0 }
        priceConsumer: { type: integer, minimum: 0 }
        costPrice: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        isHot: { type: boolean }
        isNew: { type: boolean }
        isActive: { type: boolean }
        spec: { type: ["string", "null"] }
    AdminProductUpdate:
      type: object
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        priceHospital: { type: integer, minimum: 0 }
        priceClinic: { type: integer, minimum: 0 }
        priceConsumer: { type: integer, minimum: 0 }
        costPrice: { type: integer, minimum: 0 }
        isHot: { type: boolean }
        isNew: { type: boolean }
        isActive: { type: boolean }
        spec: { type: ["string", "null"] }
    AdminStockMovement:
      type: object
      required: [id, productId, productName, productCode, type, quantity, stockAfter, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        productCode: { type: string }
        type:
          type: string
          enum: [purchase, sale, adjust]
          description: 進貨 / 銷售出貨 / 手動調整
        quantity: { type: integer, description: "正數入庫、負數出庫" }
        stockAfter: { type: integer, description: "異動後庫存" }
        reason: { type: ["string", "null"] }
        refNo: { type: ["string", "null"], description: "關聯單號（訂單 / 採購單）" }
        createdAt: { type: string, format: date-time }
    StockAdjustInput:
      type: object
      required: [productId, quantity, reason]
      properties:
        productId: { type: integer }
        quantity: { type: integer, description: "正數入庫、負數出庫，不可為 0" }
        reason: { type: string, minLength: 1, description: "盤點 / 報廢 / 其他" }
        note: { type: ["string", "null"] }
    Supplier:
      type: object
      required: [id, name, isActive, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        contactPerson: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        paymentTerms: { type: ["string", "null"], description: "付款條件，如 月結30天" }
        note: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    SupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        contactPerson: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        paymentTerms: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
    SupplierUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        contactPerson: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        paymentTerms: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        isActive: { type: boolean }
    AdminPurchaseOrderItem:
      type: object
      required: [id, productId, productName, productCode, unitCost, quantity]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        productCode: { type: string }
        unitCost: { type: integer, description: "進價 (NT$)" }
        quantity: { type: integer }
    AdminPurchaseOrder:
      type: object
      required: [id, poNo, supplierId, supplierName, status, totalAmount, createdAt, items]
      properties:
        id: { type: integer }
        poNo: { type: string }
        supplierId: { type: integer }
        supplierName: { type: string }
        status:
          type: string
          enum: [draft, ordered, received, cancelled]
        totalAmount: { type: integer }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        orderedAt: { type: ["string", "null"], format: date-time }
        receivedAt: { type: ["string", "null"], format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPurchaseOrderItem"
    PurchaseOrderLineInput:
      type: object
      required: [productId, unitCost, quantity]
      properties:
        productId: { type: integer }
        unitCost: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
    PurchaseOrderInput:
      type: object
      required: [supplierId, items]
      properties:
        supplierId: { type: integer }
        note: { type: ["string", "null"] }
        items:
          type: array
