        id: { type: integer }
        orderNo: { type: string }
        memberId: { type: integer }
        memberName: { type: string }
        memberTier:
          type: string
          enum: [hospital, clinic, consumer]
        status:
          type: string
          enum: [pending, paid, shipped, completed, cancelled]
        paymentMethod:
          type: string
          enum: [bank_transfer, cod, wallet]
        totalAmount: { type: integer }
        shippingAddress: { type: ["string", "null"] }
        receiverName: { type: ["string", "null"] }
        receiverPhone: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, paid, shipped, completed, cancelled]
    InventoryReportRow:
      type: object
      required: [productId, productName, productCode, purchasedQty, purchasedAmount, soldQty, soldAmount, adjustedQty, currentStock]
      properties:
        productId: { type: integer }
        productName: { type: string }
        productCode: { type: string }
        purchasedQty: { type: integer, description: "期間進貨數量" }
        purchasedAmount: { type: integer, description: "期間進貨金額 (NT$)" }
        soldQty: { type: integer, description: "期間銷貨數量" }
        soldAmount: { type: integer, description: "期間銷貨金額 (NT$)" }
        adjustedQty: { type: integer, description: "期間調整數量（含正負）" }
        currentStock: { type: integer }
    InventoryReport:
      type: object
      required: [purchaseTotalQty, purchaseTotalAmount, saleTotalQty, saleTotalAmount, adjustTotalQty, rows]
      properties:
        from: { type: ["string", "null"], format: date }
        to: { type: ["string", "null"], format: date }
        purchaseTotalQty: { type: integer }
        purchaseTotalAmount: { type: integer }
        saleTotalQty: { type: integer }
        saleTotalAmount: { type: integer }
        adjustTotalQty: { type: integer }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/InventoryReportRow"
