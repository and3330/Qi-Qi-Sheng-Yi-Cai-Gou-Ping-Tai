kind = "web"
previewPath = "/erp/"
title = "七期生醫 ERP"
description = "企業內部 ERP（與公司 ERP 同一套系統），資料存在獨立的 erp 資料庫分區，與商城資料分開。"
version = "2.0.0"
id = "artifacts/erp"
router = "path"

[[services]]
name = "web"
paths = [ "/erp/" ]
localPort = 18996

[services.development]
run = "pnpm --filter @workspace/erp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/erp", "run", "build" ]
serve = "static"
publicDir = "artifacts/erp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18996"
BASE_PATH = "/erp/"
